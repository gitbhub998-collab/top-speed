name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint -w frontend
      - name: Build frontend
        run: npm run build -w frontend
      - name: Check backend syntax
        run: node --check backend/src/server.js && node --check backend/src/controllers/authController.js && node --check backend/src/services/emailService.js
      - name: Build backend
        run: npm run build -w backend
